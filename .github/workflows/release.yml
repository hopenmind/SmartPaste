name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# IMPORTANT: This project targets net8.0-windows with <UseWPF>true</UseWPF>.
# WPF is a Windows-only UI framework and cannot run on Linux or macOS.
# Therefore we ONLY build for Windows RIDs (win-x64, win-arm64) and run
# the build jobs on windows-latest. Do NOT add linux/macos targets.

permissions:
  contents: write

jobs:
  build:
    name: build-windows-${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, single-file)
        run: >-
          dotnet publish SmartPaste.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Copy assets into publish output
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath assets) {
            Copy-Item -Path assets -Destination publish/assets -Recurse -Force
            Write-Host "Copied assets/ -> publish/assets/"
          } else {
            Write-Host "No assets/ folder found, skipping copy."
          }

      - name: Zip publish output
        shell: pwsh
        run: |
          $zip = "SmartPaste-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          Get-ChildItem $zip | Format-List FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPaste-${{ matrix.rid }}
          path: SmartPaste-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        shell: bash
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: artifacts/**/*.zip
          file_glob: true
