name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-windows-${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = if ($tag -match '^v?(\d+\.\d+\.\d+(\.\d+)?)') { $Matches[1] } else { '1.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version = $v"

      - name: Publish (self-contained, single-file)
        run: >-
          dotnet publish SmartPaste/core/SmartPaste.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Copy assets into publish output
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath SmartPaste/assets) {
            Copy-Item -Path SmartPaste/assets -Destination publish/assets -Recurse -Force
            Write-Host "Copied SmartPaste/assets/ -> publish/assets/"
          } else {
            Write-Host "No assets/ folder found, skipping copy."
          }

      - name: Zip publish output
        shell: pwsh
        run: |
          $zip = "SmartPaste-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          Get-ChildItem $zip | Format-List FullName, Length

      - name: Build installer (Inno Setup, x64 only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "SmartPaste\installer\SmartPaste.iss" "/DMyAppVersion=${{ steps.ver.outputs.version }}"
          Get-ChildItem SmartPaste\installer\Output -ErrorAction SilentlyContinue | Format-List FullName, Length

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPaste-${{ matrix.rid }}
          path: SmartPaste-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: SmartPaste-Setup
          path: SmartPaste/installer/Output/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        shell: bash
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
