<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Paste a punctuation-separated list to fill fields one item at a time, with emails kept whole">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0C574"/><stop offset="1" stop-color="#C6862B"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E9B657"/></marker>
    <style>text{font-family:'Segoe UI',system-ui,sans-serif}</style>
  </defs>

  <rect x="1" y="1" width="878" height="378" rx="18" fill="#1B0D20" stroke="url(#g)" stroke-opacity="0.9" stroke-width="2"/>

  <!-- clipboard with the pasted list -->
  <text x="40" y="44" font-size="13" font-weight="700" fill="#E9B657" letter-spacing="1">CLIPBOARD</text>
  <rect x="40" y="58" width="320" height="264" rx="12" fill="#180D1E" stroke="url(#g)" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="150" y="50" width="100" height="20" rx="6" fill="url(#g)"/>
  <g font-family="'Consolas','IBM Plex Mono',monospace" font-size="15" fill="#F5EEDD">
    <text x="60" y="104">keyword next<tspan fill="#E9B657">,</tspan></text>
    <text x="60" y="140">ceo bnts<tspan fill="#E9B657">,</tspan></text>
    <text x="60" y="176"><tspan fill="#B79FB0">yoann@example</tspan><tspan fill="#F0C574">.com</tspan><tspan fill="#E9B657">,</tspan></text>
    <text x="60" y="212"><tspan fill="#B79FB0">ledo@site</tspan><tspan fill="#F0C574">.eu</tspan></text>
  </g>
  <text x="60" y="266" font-size="12.5" fill="#B79FB0">a comma cuts only with a</text>
  <text x="60" y="286" font-size="12.5" fill="#B79FB0">space beside it, so the</text>
  <text x="60" y="306" font-size="12.5" fill="#F0C574">.com / .eu stay whole</text>

  <!-- arrow + engine -->
  <line x1="368" y1="190" x2="512" y2="190" stroke="#E9B657" stroke-width="2.4" marker-end="url(#a)"/>
  <rect x="392" y="150" width="96" height="34" rx="9" fill="#20112A" stroke="url(#g)" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="440" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#E9B657">Smart Paste</text>
  <text x="440" y="212" text-anchor="middle" font-size="11.5" fill="#B79FB0">types each item, Tab to next</text>

  <!-- target fields, one item each -->
  <text x="520" y="44" font-size="13" font-weight="700" fill="#E9B657" letter-spacing="1">FIELDS</text>
  <g font-family="'Segoe UI',system-ui,sans-serif" font-size="14.5" fill="#F5EEDD">
    <rect x="520" y="58" width="320" height="40" rx="8" fill="#241026" stroke="url(#g)" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="536" y="83">keyword next</text>
    <rect x="520" y="112" width="320" height="40" rx="8" fill="#241026" stroke="url(#g)" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="536" y="137">ceo bnts</text>
    <rect x="520" y="166" width="320" height="40" rx="8" fill="#241026" stroke="url(#g)" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="536" y="191">yoann@example.com</text>
    <rect x="520" y="220" width="320" height="40" rx="8" fill="#241026" stroke="url(#g)" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="536" y="245">ledo@site.eu</text>
  </g>
  <!-- tab connectors -->
  <g stroke="#E9B657" stroke-width="1.6" stroke-opacity="0.7" fill="none">
    <path d="M846 98 q14 8 0 14" marker-end="url(#a)"/>
    <path d="M846 152 q14 8 0 14" marker-end="url(#a)"/>
    <path d="M846 206 q14 8 0 14" marker-end="url(#a)"/>
  </g>

  <text x="440" y="352" text-anchor="middle" font-size="13.5" fill="#F5EEDD">Paste a punctuation-separated list and each item lands in its own field, in order.</text>
</svg>
