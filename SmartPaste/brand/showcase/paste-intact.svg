  <title>Paste, intact</title>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0C574"/><stop offset="1" stop-color="#C6862B"/></linearGradient></defs>
  <rect x="2" y="2" width="356" height="236" rx="18" fill="#1B0D20" stroke="url(#g)" stroke-width="2"/>
  <rect x="24" y="22" width="52" height="4" rx="2" fill="url(#g)"/>
