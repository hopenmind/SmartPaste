<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 108" width="300" height="108" role="img" aria-label="Copy once. Paste anywhere. Images, equations and formatting kept intact.">
  <title>Copy once. Paste anywhere.</title>
  <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0C574"/><stop offset="1" stop-color="#C6862B"/></linearGradient></defs>
  <rect x="2" y="2" width="296" height="104" rx="16" fill="#241026" stroke="url(#gold)" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="24" y="44" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="18" fill="url(#gold)">Copy once. Paste anywhere.</text>
  <text x="24" y="70" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#B79FB0">Images, equations &amp; formatting -</text>
  <text x="24" y="89" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="14" fill="#B79FB0">kept intact.</text>
</svg>
