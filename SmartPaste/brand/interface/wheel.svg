<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-label="SmartPaste radial wheel: four functions around a central hub">
  <title>SmartPaste function wheel</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0C574"/><stop offset="1" stop-color="#C6862B"/></linearGradient>
    <radialGradient id="ground" cx="0.5" cy="0.42" r="0.85"><stop offset="0" stop-color="#241130"/><stop offset="1" stop-color="#150A1A"/></radialGradient>
    <radialGradient id="hubg" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#20112A"/><stop offset="1" stop-color="#150A1A"/></radialGradient>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect x="1" y="1" width="558" height="558" rx="22" fill="url(#ground)" stroke="#C6862B" stroke-opacity="0.22" stroke-width="1.5"/>

  <circle cx="280" cy="280" r="250" fill="#1E0F27"/>
  <g stroke="#150A1A" stroke-width="18" stroke-linecap="round">
    <line x1="386" y1="174" x2="457" y2="103"/>
    <line x1="174" y1="174" x2="103" y2="103"/>
    <line x1="174" y1="386" x2="103" y2="457"/>
    <line x1="386" y1="386" x2="457" y2="457"/>
  </g>
  <circle cx="280" cy="280" r="250" fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#softglow)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="280" r="250" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="280" cy="280" r="150" fill="url(#hubg)" stroke="url(#gold)" stroke-width="2"/>

  <!-- glyphs: paste (top), copy (right), pin (bottom), Aa (left) -->
  <g fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(280,80)">
      <rect x="-20" y="-18" width="40" height="50" rx="7"/>
      <rect x="-9" y="-25" width="18" height="13" rx="4" fill="url(#gold)" stroke="none"/>
      <path d="M-11,4 L-3,12 L13,-8"/>
    </g>
    <g transform="translate(480,280)">
      <rect x="-4" y="-20" width="32" height="40" rx="6"/>
      <rect x="-20" y="-8" width="32" height="40" rx="6" fill="#1E0F27"/>
    </g>
    <g transform="translate(280,480) scale(1.5) translate(-12,-12)" stroke-width="2.4">
      <path d="M12 17v5"/>
      <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
    </g>
  </g>
  <text x="80" y="295" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="40" fill="#F5EEDD">Aa</text>

  <!-- hub content (identity is the real logo, shown alongside; hub stays text-only) -->
  <text x="280" y="262" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="24" letter-spacing="1" fill="url(#gold)">SMART-PASTE</text>
  <text x="280" y="283" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="11" fill="#B79FB0">By</text>
  <text x="280" y="303" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="15" fill="#F5EEDD">Hope 'n Mind</text>
  <text x="280" y="326" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="17" fill="#5AA9E6">&#8734;</text>
  <rect x="214" y="338" width="132" height="25" rx="12.5" fill="none" stroke="url(#gold)" stroke-opacity="0.7" stroke-width="1.3"/>
  <circle cx="233" cy="350.5" r="3.6" fill="#7FD07A"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
  <text x="246" y="355" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-weight="700" font-size="11" fill="url(#gold)">Running &#183; 3 active</text>
  <text x="280" y="382" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="11.5" fill="#8E7C8B">Hover a function to configure</text>
</svg>
