<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="SmartPaste features overview">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#pageBg)"/>

  <!-- Title -->
  <text x="500" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#0F172A">SmartPaste Features</text>
  <rect x="460" y="66" width="80" height="4" rx="2" fill="#3B82F6"/>
  <text x="500" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#64748B">Everything you need for smarter clipboard workflows</text>

  <!-- ============ ROW 1 ============ -->
  <!-- Card 1: Smart Paste -->
  <g transform="translate(40,120)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="290" height="200" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="290" height="6" rx="3" fill="#1E40AF"/>
    <!-- Icon: layers -->
    <g transform="translate(24,30)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#DBEAFE"/>
      <rect x="10" y="8" width="24" height="6" rx="3" fill="#1E40AF"/>
      <rect x="10" y="19" width="24" height="6" rx="3" fill="#3B82F6"/>
      <rect x="10" y="30" width="16" height="6" rx="3" fill="#1E40AF"/>
    </g>
    <text x="80" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Smart Paste</text>
    <text x="80" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569">Three typing modes</text>
    <!-- Mode chips -->
    <g transform="translate(24,100)">
      <rect x="0" y="0" width="74" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="37" y="18" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E40AF">Enter</text>
      <rect x="84" y="0" width="74" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="121" y="18" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E40AF">Space</text>
      <rect x="168" y="0" width="78" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="207" y="18" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1E40AF">Normal</text>
    </g>
    <text x="24" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Inject text word-by-word or char</text>
    <text x="24" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">by char with adjustable delays.</text>
  </g>

  <!-- Card 2: Telework Mode -->
  <g transform="translate(355,120)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="290" height="200" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="290" height="6" rx="3" fill="#16A34A"/>
    <!-- Icon: waveform -->
    <g transform="translate(24,30)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#DCFCE7"/>
      <rect x="8" y="26" width="4" height="10" rx="2" fill="#16A34A"/>
      <rect x="14" y="20" width="4" height="16" rx="2" fill="#16A34A"/>
      <rect x="20" y="12" width="4" height="24" rx="2" fill="#16A34A"/>
      <rect x="26" y="18" width="4" height="18" rx="2" fill="#16A34A"/>
      <rect x="32" y="24" width="4" height="12" rx="2" fill="#16A34A"/>
    </g>
    <text x="80" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Telework Mode</text>
    <g transform="translate(80,58)">
      <rect x="0" y="0" width="86" height="20" rx="10" fill="#DCFCE7"/>
      <circle cx="12" cy="10" r="4" fill="#16A34A"/>
      <text x="22" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#15803D">Active</text>
    </g>
    <text x="24" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569">Human-like typing simulation</text>
    <text x="24" y="146" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Variable keystroke timing, jitter</text>
    <text x="24" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">and natural pauses to bypass</text>
    <text x="24" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">input detection on web forms.</text>
  </g>

  <!-- Card 3: Case Converter -->
  <g transform="translate(670,120)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="290" height="200" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="290" height="6" rx="3" fill="#1E40AF"/>
    <!-- Icon: Aa -->
    <g transform="translate(24,30)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#DBEAFE"/>
      <text x="22" y="31" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#1E40AF">Aa</text>
    </g>
    <text x="80" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Case Converter</text>
    <text x="80" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569">Quick case cycling</text>
    <g transform="translate(24,100)">
      <rect x="0" y="0" width="246" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="10" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#1E40AF">UPPER</text>
      <text x="64" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">lower</text>
      <text x="108" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Title</text>
      <text x="146" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Sentence</text>
      <text x="214" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">camel</text>
    </g>
    <text x="24" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">One shortcut cycles through all</text>
    <text x="24" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">supported text cases.</text>
  </g>

  <!-- ============ ROW 2 ============ -->
  <!-- Card 4: Always On Top -->
  <g transform="translate(40,345)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="290" height="200" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="290" height="6" rx="3" fill="#16A34A"/>
    <!-- Icon: pin -->
    <g transform="translate(24,30)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#DCFCE7"/>
      <path d="M22 8 L22 24 M14 24 L30 24 L28 30 L16 30 Z" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="22" cy="8" r="3" fill="#16A34A"/>
    </g>
    <text x="80" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Always On Top</text>
    <g transform="translate(80,58)">
      <rect x="0" y="0" width="86" height="20" rx="10" fill="#DCFCE7"/>
      <circle cx="12" cy="10" r="4" fill="#16A34A"/>
      <text x="22" y="14" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#15803D">Active</text>
    </g>
    <text x="24" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569">Window pinning</text>
    <text x="24" y="146" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Pin any active window above all</text>
    <text x="24" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">others with a single shortcut.</text>
    <text x="24" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Toggle again to release.</text>
  </g>

  <!-- Card 5: Smart Copy BETA -->
  <g transform="translate(355,345)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="290" height="200" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="290" height="6" rx="3" fill="#D97706"/>
    <!-- Icon: copy/camera -->
    <g transform="translate(24,30)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#FEF3C7"/>
      <rect x="8" y="14" width="28" height="22" rx="4" fill="none" stroke="#D97706" stroke-width="3"/>
      <rect x="16" y="10" width="12" height="6" rx="2" fill="#D97706"/>
      <circle cx="22" cy="25" r="6" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
    </g>
    <text x="80" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Smart Copy</text>
    <g transform="translate(168,30)">
      <rect x="0" y="0" width="60" height="22" rx="11" fill="#FEF3C7" stroke="#FCD34D"/>
      <text x="30" y="16" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#B45309">BETA</text>
    </g>
    <text x="80" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569">Web &amp; image capture</text>
    <text x="24" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569">Capture rich content</text>
    <text x="24" y="146" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Grab web snippets, images and</text>
    <text x="24" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">formatted text into the clipboard</text>
    <text x="24" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">cache for re-injection.</text>
  </g>

  <!-- Card 6: Custom Shortcuts -->
  <g transform="translate(670,345)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="290" height="200" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="290" height="6" rx="3" fill="#1E40AF"/>
    <!-- Icon: keyboard -->
    <g transform="translate(24,30)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#DBEAFE"/>
      <rect x="7" y="14" width="30" height="18" rx="3" fill="none" stroke="#1E40AF" stroke-width="2.5"/>
      <circle cx="13" cy="23" r="2" fill="#1E40AF"/>
      <circle cx="22" cy="23" r="2" fill="#1E40AF"/>
      <circle cx="31" cy="23" r="2" fill="#1E40AF"/>
      <rect x="13" y="27" width="18" height="2.5" rx="1" fill="#1E40AF"/>
    </g>
    <text x="80" y="48" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Custom Shortcuts</text>
    <text x="80" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#475569">Visual keyboard editor</text>
    <g transform="translate(24,100)">
      <rect x="0" y="0" width="40" height="26" rx="6" fill="#1E40AF"/>
      <text x="20" y="18" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Ctrl</text>
      <text x="46" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8">+</text>
      <rect x="56" y="0" width="40" height="26" rx="6" fill="#3B82F6"/>
      <text x="76" y="18" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Shift</text>
      <text x="102" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8">+</text>
      <rect x="112" y="0" width="40" height="26" rx="6" fill="#1E40AF"/>
      <text x="132" y="18" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">V</text>
    </g>
    <text x="24" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Rebind every action through a</text>
    <text x="24" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">clickable visual keyboard UI.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,565)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#16A34A"/>
    <text x="22" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#475569">Active feature</text>
    <rect x="140" y="0" width="14" height="14" rx="3" fill="#1E40AF"/>
    <text x="162" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#475569">Core feature</text>
    <rect x="270" y="0" width="14" height="14" rx="3" fill="#D97706"/>
    <text x="292" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#475569">Beta feature</text>
  </g>
</svg>
