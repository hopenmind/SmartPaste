<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="SmartPaste banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Decorative subtle circles -->
  <circle cx="1080" cy="60" r="180" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="1180" cy="360" r="120" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="60" cy="380" r="90" fill="#FFFFFF" opacity="0.04"/>

  <!-- Clipboard icon -->
  <g transform="translate(840,90)" filter="url(#iconGlow)">
    <!-- Board -->
    <rect x="0" y="20" width="220" height="220" rx="24" ry="24" fill="url(#clipGrad)"/>
    <!-- Clip top -->
    <rect x="70" y="0" width="80" height="44" rx="14" ry="14" fill="#1E3A8A"/>
    <rect x="82" y="10" width="56" height="26" rx="8" ry="8" fill="#93C5FD"/>
    <!-- Text lines -->
    <rect x="36" y="80" width="148" height="14" rx="7" fill="#1E40AF" opacity="0.85"/>
    <rect x="36" y="112" width="120" height="14" rx="7" fill="#3B82F6" opacity="0.75"/>
    <rect x="36" y="144" width="148" height="14" rx="7" fill="#1E40AF" opacity="0.85"/>
    <rect x="36" y="176" width="96" height="14" rx="7" fill="#3B82F6" opacity="0.65"/>
    <!-- Spark overlay (smart) -->
    <g transform="translate(170,170)">
      <circle cx="20" cy="20" r="30" fill="#FBBF24"/>
      <path d="M20 4 L24 16 L36 20 L24 24 L20 36 L16 24 L4 20 L16 16 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- App name -->
  <text x="80" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="92" font-weight="700" fill="#FFFFFF" letter-spacing="-2">SmartPaste</text>

  <!-- Accent underline -->
  <rect x="82" y="220" width="180" height="6" rx="3" fill="#FBBF24"/>

  <!-- Tagline -->
  <text x="84" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="400" fill="#DBEAFE">Your smart clipboard companion</text>

  <!-- Version badge -->
  <g transform="translate(84,300)">
    <rect x="0" y="0" width="92" height="34" rx="17" ry="17" fill="#1E3A8A" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="46" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">v1.0</text>
  </g>

  <!-- Platform tag -->
  <g transform="translate(190,300)">
    <rect x="0" y="0" width="150" height="34" rx="17" ry="17" fill="#FFFFFF" opacity="0.12" stroke="#BFDBFE" stroke-width="1.2"/>
    <text x="75" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#DBEAFE">Windows · WPF</text>
  </g>
</svg>
