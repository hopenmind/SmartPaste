<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="SmartPaste architecture diagram">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="managerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="actionGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="hotkeyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3B82F6"/>
    </marker>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#archBg)"/>

  <!-- Subtle grid dots -->
  <g fill="#1E40AF" opacity="0.15">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/>
    <circle cx="500" cy="100" r="1.5"/><circle cx="600" cy="100" r="1.5"/><circle cx="700" cy="100" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/>
    <circle cx="700" cy="200" r="1.5"/>
  </g>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#F1F5F9">Architecture Overview</text>
  <rect x="370" y="50" width="60" height="3" rx="1.5" fill="#3B82F6"/>

  <!-- ============ FLOW ROW (top) ============ -->
  <!-- User -->
  <g filter="url(#nodeShadow)">
    <rect x="30" y="80" width="120" height="56" rx="12" fill="url(#userGrad)"/>
    <g transform="translate(48,98)">
      <circle cx="10" cy="6" r="5" fill="#FFFFFF"/>
      <path d="M0 22 C0 14 20 14 20 22 L20 26 L0 26 Z" fill="#FFFFFF"/>
    </g>
    <text x="90" y="105" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">User</text>
    <text x="90" y="123" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FEF3C7">presses key</text>
  </g>

  <!-- arrow User -> Hotkey -->
  <line x1="150" y1="108" x2="188" y2="108" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hotkey -->
  <g filter="url(#nodeShadow)">
    <rect x="190" y="80" width="130" height="56" rx="12" fill="url(#hotkeyGrad)"/>
    <g transform="translate(208,98)">
      <rect x="0" y="2" width="20" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <circle cx="5" cy="9" r="1.4" fill="#FFFFFF"/>
      <circle cx="10" cy="9" r="1.4" fill="#FFFFFF"/>
      <circle cx="15" cy="9" r="1.4" fill="#FFFFFF"/>
    </g>
    <text x="265" y="105" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Hotkey</text>
    <text x="265" y="123" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#DBEAFE">global hook</text>
  </g>

  <!-- arrow Hotkey -> Manager -->
  <line x1="320" y1="108" x2="358" y2="108" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Manager -->
  <g filter="url(#nodeShadow)">
    <rect x="360" y="80" width="130" height="56" rx="12" fill="url(#managerGrad)"/>
    <g transform="translate(378,96)" stroke="#FFFFFF" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="22" height="22" rx="4"/>
      <line x1="0" y1="7" x2="22" y2="7"/>
      <circle cx="5" cy="3.5" r="0.9" fill="#FFFFFF"/>
    </g>
    <text x="435" y="105" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Manager</text>
    <text x="435" y="123" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#DBEAFE">routes action</text>
  </g>

  <!-- arrow Manager -> Action -->
  <line x1="490" y1="108" x2="528" y2="108" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Action -->
  <g filter="url(#nodeShadow)">
    <rect x="530" y="80" width="130" height="56" rx="12" fill="url(#actionGrad)"/>
    <g transform="translate(548,98)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 0 L4 14 L11 14 L9 24 L20 10 L13 10 Z" fill="#FFFFFF"/>
    </g>
    <text x="605" y="105" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Action</text>
    <text x="605" y="123" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#DCFCE7">executes</text>
  </g>

  <!-- arrow Action -> Target App -->
  <line x1="660" y1="108" x2="698" y2="108" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Target App -->
  <g filter="url(#nodeShadow)">
    <rect x="690" y="80" width="90" height="56" rx="12" fill="url(#coreGrad)" stroke="#475569" stroke-width="1"/>
    <g transform="translate(703,98)" stroke="#94A3B8" stroke-width="1.6" fill="none">
      <rect x="0" y="0" width="22" height="18" rx="2"/>
      <line x1="0" y1="5" x2="22" y2="5"/>
      <circle cx="3" cy="2.5" r="0.8" fill="#94A3B8" stroke="none"/>
    </g>
    <text x="735" y="105" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">Target</text>
    <text x="735" y="121" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94A3B8">App</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="170" x2="760" y2="170" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="400" y="185" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B" letter-spacing="1">DATA FLOW</text>

  <!-- ============ CORE COMPONENT ROW (middle) ============ -->
  <!-- Clipboard -->
  <g filter="url(#nodeShadow)">
    <rect x="50" y="210" width="130" height="64" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <g transform="translate(68,224)">
      <rect x="6" y="2" width="14" height="6" rx="2" fill="#3B82F6"/>
      <rect x="0" y="6" width="26" height="26" rx="4" fill="none" stroke="#3B82F6" stroke-width="2"/>
      <rect x="5" y="14" width="16" height="2.5" rx="1" fill="#60A5FA"/>
      <rect x="5" y="20" width="16" height="2.5" rx="1" fill="#60A5FA"/>
      <rect x="5" y="26" width="10" height="2.5" rx="1" fill="#60A5FA"/>
    </g>
    <text x="115" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">Clipboard</text>
    <text x="115" y="258" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94A3B8">source text buffer</text>
  </g>

  <!-- SmartCopy -->
  <g filter="url(#nodeShadow)">
    <rect x="210" y="210" width="130" height="64" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <g transform="translate(228,224)" stroke="#3B82F6" stroke-width="2" fill="none">
      <rect x="0" y="6" width="26" height="20" rx="3"/>
      <rect x="8" y="2" width="10" height="5" rx="1.5" fill="#3B82F6"/>
      <circle cx="13" cy="16" r="5" fill="#1E293B"/>
    </g>
    <text x="275" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">SmartCopy</text>
    <text x="275" y="258" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#D97706">web / image capture</text>
  </g>

  <!-- FormatCache -->
  <g filter="url(#nodeShadow)">
    <rect x="370" y="210" width="130" height="64" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <g transform="translate(388,226)" stroke="#3B82F6" stroke-width="2" fill="none">
      <rect x="0" y="0" width="9" height="9" rx="1.5"/>
      <rect x="0" y="13" width="9" height="9" rx="1.5"/>
      <rect x="13" y="0" width="9" height="9" rx="1.5"/>
      <rect x="13" y="13" width="9" height="9" rx="1.5"/>
    </g>
    <text x="435" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">FormatCache</text>
    <text x="435" y="258" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94A3B8">normalizes formats</text>
  </g>

  <!-- SmartInject -->
  <g filter="url(#nodeShadow)">
    <rect x="530" y="210" width="130" height="64" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <g transform="translate(548,224)" stroke="#3B82F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 14 L18 14"/>
      <path d="M12 8 L18 14 L12 20"/>
      <rect x="20" y="4" width="4" height="20" rx="1" fill="#3B82F6" stroke="none"/>
    </g>
    <text x="595" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">SmartInject</text>
    <text x="595" y="258" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#94A3B8">types into target</text>
  </g>

  <!-- arrows between core components (bidirectional) -->
  <g stroke="#3B82F6" stroke-width="1.6" opacity="0.8">
    <line x1="180" y1="242" x2="208" y2="242" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
    <line x1="340" y1="242" x2="368" y2="242" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
    <line x1="500" y1="242" x2="528" y2="242" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
  </g>

  <!-- SmartInject -> Target App (curved up) -->
  <path d="M595 210 C595 180 735 170 735 138" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  <text x="690" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#34D399">inject</text>

  <!-- ============ UI / SETTINGS ROW (bottom) ============ -->
  <line x1="40" y1="320" x2="760" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="400" y="335" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748B" letter-spacing="1">UI &amp; CONFIGURATION</text>

  <!-- MainWindow -->
  <g filter="url(#nodeShadow)">
    <rect x="120" y="355" width="160" height="60" rx="12" fill="url(#managerGrad)"/>
    <g transform="translate(138,370)" stroke="#FFFFFF" stroke-width="1.8" fill="none">
      <rect x="0" y="0" width="24" height="20" rx="2"/>
      <line x1="0" y1="6" x2="24" y2="6"/>
      <rect x="3" y="2.5" width="3" height="2" fill="#FFFFFF" stroke="none"/>
    </g>
    <text x="200" y="383" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">MainWindow</text>
    <text x="200" y="400" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#DBEAFE">WPF UI shell</text>
  </g>

  <!-- Settings -->
  <g filter="url(#nodeShadow)">
    <rect x="520" y="355" width="160" height="60" rx="12" fill="url(#managerGrad)"/>
    <g transform="translate(538,370)" stroke="#FFFFFF" stroke-width="1.8" fill="none">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 0 L12 4 M12 20 L12 24 M0 12 L4 12 M20 12 L24 12 M3.5 3.5 L6.5 6.5 M17.5 17.5 L20.5 20.5 M3.5 20.5 L6.5 17.5 M17.5 6.5 L20.5 3.5"/>
    </g>
    <text x="600" y="383" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Settings</text>
    <text x="600" y="400" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#DBEAFE">persisted config</text>
  </g>

  <!-- MainWindow <-> Settings -->
  <line x1="280" y1="385" x2="518" y2="385" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>

  <!-- MainWindow <-> Manager (curved up to Manager node at x435,y136) -->
  <path d="M200 355 C200 300 435 300 435 138" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)" opacity="0.7"/>

  <!-- Settings <-> Manager (curved) -->
  <path d="M600 355 C600 280 470 280 470 138" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)" opacity="0.7"/>

  <!-- Legend -->
  <g transform="translate(40,448)" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94A3B8">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="url(#userGrad)"/>
    <text x="18" y="10">Entry</text>
    <rect x="70" y="0" width="12" height="12" rx="3" fill="url(#managerGrad)"/>
    <text x="88" y="10">Control / UI</text>
    <rect x="170" y="0" width="12" height="12" rx="3" fill="#1E293B" stroke="#3B82F6"/>
    <text x="188" y="10">Core service</text>
    <rect x="278" y="0" width="12" height="12" rx="3" fill="url(#actionGrad)"/>
    <text x="296" y="10">Output</text>
    <line x1="350" y1="6" x2="380" y2="6" stroke="#60A5FA" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="386" y="10">bidirectional link</text>
  </g>

  <text x="400" y="485" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#475569">SmartPaste · WPF modular architecture</text>
</svg>
