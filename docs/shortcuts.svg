<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="SmartPaste default keyboard shortcuts">
  <defs>
    <linearGradient id="pageBg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="keyGradBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rowShadow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="500" fill="url(#pageBg2)"/>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Default Keyboard Shortcuts</text>
  <rect x="410" y="62" width="80" height="4" rx="2" fill="#3B82F6"/>

  <!-- Column headers -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1">
    <text x="50" y="100">FEATURE</text>
    <text x="320" y="100">SHORTCUT</text>
    <text x="650" y="100">DESCRIPTION</text>
  </g>
  <line x1="40" y1="110" x2="860" y2="110" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ============ ROW 1: Smart Paste (Enter) ============ -->
  <g transform="translate(40,122)">
    <rect x="0" y="0" width="820" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#rowShadow)"/>
    <rect x="0" y="0" width="5" height="60" rx="2.5" fill="#1E40AF"/>
    <g transform="translate(20,18)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#DBEAFE"/>
      <rect x="6" y="6" width="16" height="3.5" rx="1.75" fill="#1E40AF"/>
      <rect x="6" y="12.5" width="16" height="3.5" rx="1.75" fill="#3B82F6"/>
      <rect x="6" y="19" width="10" height="3.5" rx="1.75" fill="#1E40AF"/>
    </g>
    <text x="58" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Smart Paste</text>
    <text x="58" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748B">Enter mode</text>
    <!-- Key caps -->
    <g filter="url(#keyShadow)" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">
      <g transform="translate(320,16)">
        <rect x="0" y="0" width="50" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="25" y="20" text-anchor="middle" fill="#1E40AF">Ctrl</text>
      </g>
      <text x="378" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(392,16)">
        <rect x="0" y="0" width="52" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="26" y="20" text-anchor="middle" fill="#1E40AF">Shift</text>
      </g>
      <text x="452" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(466,16)">
        <rect x="0" y="0" width="36" height="30" rx="7" fill="url(#keyGradBlue)"/>
        <text x="18" y="20" text-anchor="middle" fill="#FFFFFF">V</text>
      </g>
    </g>
    <text x="650" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#475569">Paste word-by-word with</text>
    <text x="650" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Enter between each word</text>
  </g>

  <!-- ============ ROW 2: Smart Paste (Space) ============ -->
  <g transform="translate(40,190)">
    <rect x="0" y="0" width="820" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#rowShadow)"/>
    <rect x="0" y="0" width="5" height="60" rx="2.5" fill="#1E40AF"/>
    <g transform="translate(20,18)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#DBEAFE"/>
      <rect x="6" y="6" width="16" height="3.5" rx="1.75" fill="#1E40AF"/>
      <rect x="6" y="12.5" width="16" height="3.5" rx="1.75" fill="#3B82F6"/>
      <rect x="6" y="19" width="10" height="3.5" rx="1.75" fill="#1E40AF"/>
    </g>
    <text x="58" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Smart Paste</text>
    <text x="58" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748B">Space mode</text>
    <g filter="url(#keyShadow)" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">
      <g transform="translate(320,16)">
        <rect x="0" y="0" width="50" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="25" y="20" text-anchor="middle" fill="#1E40AF">Ctrl</text>
      </g>
      <text x="378" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(392,16)">
        <rect x="0" y="0" width="40" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="20" y="20" text-anchor="middle" fill="#1E40AF">Alt</text>
      </g>
      <text x="440" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(454,16)">
        <rect x="0" y="0" width="36" height="30" rx="7" fill="url(#keyGradBlue)"/>
        <text x="18" y="20" text-anchor="middle" fill="#FFFFFF">V</text>
      </g>
    </g>
    <text x="650" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#475569">Paste word-by-word with</text>
    <text x="650" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Space between each word</text>
  </g>

  <!-- ============ ROW 3: Smart Paste (Normal) ============ -->
  <g transform="translate(40,258)">
    <rect x="0" y="0" width="820" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#rowShadow)"/>
    <rect x="0" y="0" width="5" height="60" rx="2.5" fill="#1E40AF"/>
    <g transform="translate(20,18)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#DBEAFE"/>
      <rect x="6" y="6" width="16" height="3.5" rx="1.75" fill="#1E40AF"/>
      <rect x="6" y="12.5" width="16" height="3.5" rx="1.75" fill="#3B82F6"/>
      <rect x="6" y="19" width="10" height="3.5" rx="1.75" fill="#1E40AF"/>
    </g>
    <text x="58" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Smart Paste</text>
    <text x="58" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748B">Normal mode</text>
    <g filter="url(#keyShadow)" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">
      <g transform="translate(320,16)">
        <rect x="0" y="0" width="50" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="25" y="20" text-anchor="middle" fill="#1E40AF">Ctrl</text>
      </g>
      <text x="378" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(392,16)">
        <rect x="0" y="0" width="52" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="26" y="20" text-anchor="middle" fill="#1E40AF">Win</text>
      </g>
      <text x="452" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(466,16)">
        <rect x="0" y="0" width="36" height="30" rx="7" fill="url(#keyGradBlue)"/>
        <text x="18" y="20" text-anchor="middle" fill="#FFFFFF">V</text>
      </g>
    </g>
    <text x="650" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#475569">Type text character by</text>
    <text x="650" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">character (Telework style)</text>
  </g>

  <!-- ============ ROW 4: Case Converter ============ -->
  <g transform="translate(40,326)">
    <rect x="0" y="0" width="820" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#rowShadow)"/>
    <rect x="0" y="0" width="5" height="60" rx="2.5" fill="#16A34A"/>
    <g transform="translate(20,18)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#DCFCE7"/>
      <text x="14" y="21" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#16A34A">Aa</text>
    </g>
    <text x="58" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Case Converter</text>
    <text x="58" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748B">Text case cycling</text>
    <g filter="url(#keyShadow)" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">
      <g transform="translate(320,16)">
        <rect x="0" y="0" width="50" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="25" y="20" text-anchor="middle" fill="#16A34A">Ctrl</text>
      </g>
      <text x="378" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(392,16)">
        <rect x="0" y="0" width="52" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="26" y="20" text-anchor="middle" fill="#16A34A">Win</text>
      </g>
      <text x="452" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(466,16)">
        <rect x="0" y="0" width="36" height="30" rx="7" fill="#16A34A"/>
        <text x="18" y="20" text-anchor="middle" fill="#FFFFFF">C</text>
      </g>
    </g>
    <text x="650" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#475569">Cycle through text cases</text>
    <text x="650" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">(UPPER, lower, Title, ...)</text>
  </g>

  <!-- ============ ROW 5: Always On Top ============ -->
  <g transform="translate(40,394)">
    <rect x="0" y="0" width="820" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#rowShadow)"/>
    <rect x="0" y="0" width="5" height="60" rx="2.5" fill="#16A34A"/>
    <g transform="translate(20,18)">
      <rect x="0" y="0" width="28" height="28" rx="7" fill="#DCFCE7"/>
      <path d="M14 7 L14 16 M9 16 L19 16 L18 21 L10 21 Z" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="7" r="2" fill="#16A34A"/>
    </g>
    <text x="58" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Always On Top</text>
    <text x="58" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#64748B">Window pinning</text>
    <g filter="url(#keyShadow)" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">
      <g transform="translate(320,16)">
        <rect x="0" y="0" width="50" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="25" y="20" text-anchor="middle" fill="#16A34A">Ctrl</text>
      </g>
      <text x="378" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(392,16)">
        <rect x="0" y="0" width="40" height="30" rx="7" fill="url(#keyGrad)" stroke="#94A3B8" stroke-width="1"/>
        <text x="20" y="20" text-anchor="middle" fill="#16A34A">Alt</text>
      </g>
      <text x="440" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">+</text>
      <g transform="translate(454,16)">
        <rect x="0" y="0" width="36" height="30" rx="7" fill="#16A34A"/>
        <text x="18" y="20" text-anchor="middle" fill="#FFFFFF">T</text>
      </g>
    </g>
    <text x="650" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#475569">Pin the active window</text>
    <text x="650" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">on top of all others</text>
  </g>

  <!-- Footer note -->
  <line x1="40" y1="470" x2="860" y2="470" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="488" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94A3B8">All shortcuts are fully customizable via Settings → Custom Shortcuts editor</text>
</svg>
